                                        <path id="actor0ef557d0-b10a-4ca7-a384-ff7bd764506d" d="M 10 365 m 14.962406015037594 15.037593984962406 a 15.037593984962406 15.037593984962406  0 0  1   30.075187969924812 0 m -30.075187969924812 0 a 15.037593984962406 15.037593984962406  0 0  0   30.075187969924812 0 m -15.037593984962406 15.037593984962406 l 0 30.075187969924812 m -15.037593984962406 -15.037593984962406 l 30.075187969924812 0 m -15.037593984962406 15.037593984962406 l -15.037593984962406 24 m 15.037593984962406 -24 l 15.037593984962406 24 " fill="rgb(255, 255, 255)" fill-opacity="1" stroke-opacity="1" stroke="black" fill-rule="nonzero"></path><text id="actor0ef557d0-b10a-4ca7-a384-ff7bd764506dText" x="10" y="455" fill="black" font-size="12" font-family="Arial" font-weight="normal" text-anchor="middle"><tspan x="40" dy="14">Etudiant </tspan></text><rect id="1bbcd7c5-ca59-4635-adfa-045d9e82c2b4" x="5" y="360" height="90" width="70" stroke-width="1" stroke-dasharray="3,1" fill="none" stroke="none"></rect><rect id="activity4f6ea02a-0b18-4b92-bca5-b1aadb05f37e" x="225" y="270" height="270" width="235" rx="10" ry="10" fill="rgb(183, 221, 232)" fill-opacity="1" stroke-opacity="1" stroke="rgb(32, 88, 103)"></rect><text id="activity4f6ea02a-0b18-4b92-bca5-b1aadb05f37eText" x="225" y="312" fill="black" font-size="12" font-family="Arial" font-weight="normal" text-anchor="start" data-text="Permet à l’utilisateur de:

‎ 

- Rechercher des cours selon mot clé / sigle.
- Consulter les informations d’un cours:
   - Données officielles (Planifium)
   - Statistiques académiques (CSV)
   - Avis étudiants (Discord)
- Comparer les cours selon des critères.
- Présenter les résultats dans une interface claire et unifiée."><tspan x="228" dy="14">Permet à l’utilisateur de: </tspan><tspan x="228" dy="14"> </tspan><tspan x="228" dy="14">‎  </tspan><tspan x="228" dy="14"> </tspan><tspan x="228" dy="14">- Rechercher des cours selon mot clé / </tspan><tspan x="228" dy="14">sigle. </tspan><tspan x="228" dy="14">- Consulter les informations d’un cours: </tspan><tspan x="228" dy="14">   - Données officielles (Planifium) </tspan><tspan x="228" dy="14">   - Statistiques académiques (CSV) </tspan><tspan x="228" dy="14">   - Avis étudiants (Discord) </tspan><tspan x="228" dy="14">- Comparer les cours selon des critères. </tspan><tspan x="228" dy="14">- Présenter les résultats dans une interface </tspan><tspan x="228" dy="14">claire et unifiée. </tspan></text><rect id="bbfe4152-deb3-487a-b961-4b2f8244747e" x="220" y="265" height="280" width="245" stroke-width="1" stroke-dasharray="3,1" fill="none" stroke="none"></rect><rect id="activityab313d25-a8ec-435e-853f-d367955d27d2" x="680" y="60" height="150" width="160" rx="10" ry="10" fill="rgb(221, 214, 229)" fill-opacity="1" stroke-opacity="1" stroke="rgb(84,66,106)"></rect><text id="activityab313d25-a8ec-435e-853f-d367955d27d2Text" x="680" y="63" fill="black" font-size="12" font-family="Arial" font-weight="normal" text-anchor="start" data-text="Fournit les informations officielles sur les cours:

‎ 

 - Titre/Code
 - Crédits
 - Horaires
 - Description
 - Cours préalables"><tspan x="683" dy="14">Fournit les informations </tspan><tspan x="683" dy="14">officielles sur les cours: </tspan><tspan x="683" dy="14"> </tspan><tspan x="683" dy="14">‎  </tspan><tspan x="683" dy="14"> </tspan><tspan x="683" dy="14"> - Titre/Code </tspan><tspan x="683" dy="14"> - Crédits </tspan><tspan x="683" dy="14"> - Horaires </tspan><tspan x="683" dy="14"> - Description </tspan><tspan x="683" dy="14"> - Cours préalables </tspan></text><rect id="2c3624a6-06c6-4d85-a661-90f114f9bf38" x="675" y="55" height="160" width="170" stroke-width="1" stroke-dasharray="3,1" fill="none" stroke="none"></rect><rect id="activity534d6659-dba8-4edd-a7de-a329135a86c8" x="680" y="270" height="170" width="160" rx="10" ry="10" fill="rgb(221, 214, 229)" fill-opacity="1" stroke-opacity="1" stroke="rgb(84,66,106)"></rect><text id="activity534d6659-dba8-4edd-a7de-a329135a86c8Text" x="680" y="283" fill="black" font-size="12" font-family="Arial" font-weight="normal" text-anchor="start" data-text="Permet de récupérer automatiquement les messages publiés dans un canal Discord dédié.
Ces messages contiennent les avis des étudiants sur leurs cours :
 - difficulté perçue
 - charge de travail estimée
 - commentaires"><tspan x="683" dy="14">Permet de récupérer </tspan><tspan x="683" dy="14">automatiquement les </tspan><tspan x="683" dy="14">messages publiés dans un </tspan><tspan x="683" dy="14">canal Discord dédié. </tspan><tspan x="683" dy="14">Ces messages contiennent </tspan><tspan x="683" dy="14">les avis des étudiants sur </tspan><tspan x="683" dy="14">leurs cours : </tspan><tspan x="683" dy="14"> - difficulté perçue </tspan><tspan x="683" dy="14"> - charge de travail estimée </tspan><tspan x="683" dy="14"> - commentaires </tspan></text><rect id="afc33948-1c8b-4892-8b09-481207dd64c2" x="675" y="265" height="180" width="170" stroke-width="1" stroke-dasharray="3,1" fill="none" stroke="none"></rect><rect id="activity376cfccb-c93c-4be8-a7b0-171e99e848ad" x="680" y="530" height="160" width="160" rx="10" ry="10" fill="rgb(221, 214, 229)" fill-opacity="1" stroke-opacity="1" stroke="rgb(84,66,106)"></rect><text id="activity376cfccb-c93c-4be8-a7b0-171e99e848adText" x="680" y="531" fill="black" font-size="12" font-family="Arial" font-weight="normal" text-anchor="start" data-text="Source externe fournissantles statistiques globales d’un cours pour une session donnée:

